# ================================
# Server Configuration
# ================================
server.port=8080

# ================================
# Database Configuration (H2 for local testing)
# ================================
spring.datasource.url=jdbc:h2:mem:transitops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================
# JPA/Hibernate Configuration
# ================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================================
# Flyway Configuration
# ================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ================================
# JWT Configuration
# ================================
app.jwt.secret=TransitOpsSecretKeyForJWTTokenSigningMustBeAtLeast256BitsLong2024
app.jwt.expiration-ms=86400000
